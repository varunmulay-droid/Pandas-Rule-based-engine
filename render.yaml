services:
  - type: web
    name: rag-pipeline-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: LLM_MODEL
        sync: false
