<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1180" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6472"/>
    </marker>
    <linearGradient id="ingest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#2f6fe0"/>
    </linearGradient>
    <linearGradient id="prep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26c6a4"/>
      <stop offset="100%" stop-color="#159c81"/>
    </linearGradient>
    <linearGradient id="file" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8f97a3"/>
      <stop offset="100%" stop-color="#6c7480"/>
    </linearGradient>
    <linearGradient id="rules" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7a84f"/>
      <stop offset="100%" stop-color="#e0822f"/>
    </linearGradient>
    <linearGradient id="embed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a06bf0"/>
      <stop offset="100%" stop-color="#7c3fd8"/>
    </linearGradient>
    <linearGradient id="compress" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0618e"/>
      <stop offset="100%" stop-color="#d8306a"/>
    </linearGradient>
    <linearGradient id="rag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e2e38"/>
      <stop offset="100%" stop-color="#14141a"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="1180" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1d23">RAG Pipeline Architecture</text>
  <text x="380" y="64" text-anchor="middle" font-size="13" fill="#767c87">FastAPI backend  →  Langflow orchestration</text>

  <!-- 1. Ingestion -->
  <g filter="url(#soft-shadow)">
    <rect x="140" y="95" width="480" height="70" rx="14" fill="url(#ingest)"/>
  </g>
  <text x="380" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Ingestion Layer</text>
  <text x="380" y="146" text-anchor="middle" font-size="12.5" fill="#e7effe">.csv · .xls · .xlsx · .json · .md · .pdf</text>

  <line x1="380" y1="165" x2="380" y2="200" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. Preprocessing -->
  <g filter="url(#soft-shadow)">
    <rect x="110" y="200" width="540" height="80" rx="14" fill="url(#prep)"/>
  </g>
  <text x="380" y="233" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Preprocessing</text>
  <text x="380" y="257" text-anchor="middle" font-size="12.5" fill="#e2fbf4">Data Filtering  ·  Deduplication  ·  Normalization</text>

  <line x1="380" y1="280" x2="380" y2="315" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. Preprocessed file -->
  <g filter="url(#soft-shadow)">
    <rect x="220" y="315" width="320" height="60" rx="14" fill="url(#file)"/>
  </g>
  <text x="380" y="351" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">Preprocessed File</text>

  <line x1="380" y1="375" x2="380" y2="410" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Rule engine -->
  <g filter="url(#soft-shadow)">
    <rect x="90" y="410" width="580" height="90" rx="14" fill="url(#rules)"/>
  </g>
  <text x="380" y="443" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Pandas Rule-Based Engine</text>
  <text x="380" y="466" text-anchor="middle" font-size="12.5" fill="#fdecdc">Vectorized evaluation via DataFrame.query()</text>
  <text x="380" y="484" text-anchor="middle" font-size="12.5" fill="#fdecdc">or numpy.select — no row-by-row loops</text>

  <line x1="380" y1="500" x2="380" y2="535" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 5. Embeddings -->
  <g filter="url(#soft-shadow)">
    <rect x="110" y="535" width="540" height="80" rx="14" fill="url(#embed)"/>
  </g>
  <text x="380" y="568" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Embeddings Model</text>
  <text x="380" y="592" text-anchor="middle" font-size="12.5" fill="#f0e7fd">Tokenization via OpenRouter</text>

  <line x1="380" y1="615" x2="380" y2="650" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 6. Compression -->
  <g filter="url(#soft-shadow)">
    <rect x="110" y="650" width="540" height="80" rx="14" fill="url(#compress)"/>
  </g>
  <text x="380" y="683" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Context Compression Layer</text>
  <text x="380" y="707" text-anchor="middle" font-size="12.5" fill="#fde3ec">Top-k retrieval packed into a token/char budget</text>

  <line x1="380" y1="730" x2="380" y2="765" stroke="#5b6472" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 7. RAG via Langflow -->
  <g filter="url(#soft-shadow)">
    <rect x="70" y="765" width="620" height="100" rx="16" fill="url(#rag)"/>
  </g>
  <text x="380" y="800" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">RAG System via Langflow</text>
  <text x="380" y="825" text-anchor="middle" font-size="13" fill="#c9cdd6">Prompt  →  LLM  (OpenRouter)</text>
  <text x="380" y="847" text-anchor="middle" font-size="11.5" fill="#8b909b" font-style="italic">UI and orchestration owned entirely by Langflow</text>

  <!-- Divider -->
  <line x1="70" y1="900" x2="690" y2="900" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Legend -->
  <text x="380" y="928" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a505b">Backend (FastAPI)</text>
  <rect x="255" y="940" width="14" height="14" rx="3" fill="url(#ingest)"/>
  <text x="275" y="951" font-size="11.5" fill="#4a505b">Ingest</text>
  <rect x="335" y="940" width="14" height="14" rx="3" fill="url(#prep)"/>
  <text x="355" y="951" font-size="11.5" fill="#4a505b">Preprocess</text>
  <rect x="435" y="940" width="14" height="14" rx="3" fill="url(#rules)"/>
  <text x="455" y="951" font-size="11.5" fill="#4a505b">Rules</text>
  <rect x="505" y="940" width="14" height="14" rx="3" fill="url(#embed)"/>
  <text x="525" y="951" font-size="11.5" fill="#4a505b">Embed</text>

  <text x="380" y="985" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4a505b">Orchestration (Langflow)</text>
  <rect x="320" y="997" width="14" height="14" rx="3" fill="url(#compress)"/>
  <text x="340" y="1008" font-size="11.5" fill="#4a505b">Compress</text>
  <rect x="420" y="997" width="14" height="14" rx="3" fill="url(#rag)"/>
  <text x="440" y="1008" font-size="11.5" fill="#4a505b">RAG / LLM</text>

  <text x="380" y="1050" text-anchor="middle" font-size="11" fill="#a3a8b1">github.com/varunmulay-droid/Pandas-Rule-based-engine</text>
</svg>
